server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads (subtitle files, settings imports) and long timeouts
    # for streaming/transcoding requests proxied to the API.
    client_max_body_size 4G;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;

    # Defer DNS resolution of the api container to per-request — nginx
    # otherwise tries to resolve `milmil-api` at startup and aborts if the
    # api container isn't running yet (compose race, smoke-test isolation,
    # api restart). 127.0.0.11 is Docker's embedded DNS resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $milmil_api_upstream "http://milmil-api:8080";

    # gzip compression for text assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket endpoint (notifications, progress events)
    location /ws {
        proxy_pass $milmil_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket connections are long-lived
        proxy_read_timeout 86400s;
    }

    # API proxy
    location /api/ {
        proxy_pass $milmil_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Allow byte-range requests to pass through unchanged for streaming
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Long-term cache for hashed asset bundles
    location ~* \.(js|css|woff2|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Shorter cache for images / icons (may change between releases without hashing)
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
