pre-commit:
  parallel: true
  commands:
    vp-check:
      glob: '**/*.{js,jsx,ts,tsx,json,css}'
      run: vp fmt --write {staged_files} && vp lint --fix {staged_files}
      stage_fixed: true

    type-check:
      glob: '**/*.{ts,tsx}'
      run: bunx tsc --noEmit

pre-push:
  parallel: true
  commands:
    test:
      run: bun run test:run

commit-msg:
  commands:
    lint:
      run: bunx commitlint --edit {1}
