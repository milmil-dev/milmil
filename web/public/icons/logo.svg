<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="milmil">
  <title>milmil</title>
  <!--
    Luminous Geometry mark.
    Two overlapping translucent discs form a vesica piscis; the intersection
    naturally brightens via screen-blend, framing a centered play triangle.
    Each disc fades top→bottom for a soft glow. Renders best on dark surfaces.
  -->
  <defs>
    <linearGradient id="mm-disc-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C7FE0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3D3F8C" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="mm-disc-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B89BFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6E54B8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <g style="isolation: isolate">
    <circle cx="14" cy="20" r="12" fill="url(#mm-disc-a)" style="mix-blend-mode: screen"/>
    <circle cx="26" cy="20" r="12" fill="url(#mm-disc-b)" style="mix-blend-mode: screen"/>
  </g>
  <path d="M17.5 15.5 L17.5 24.5 L24.5 20 Z" fill="#0A0A12"/>
</svg>
