<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Cat face - round, soft, kawaii style -->

  <!-- Ears with soft curves -->
  <path d="M22 42 Q18 18 32 30" fill="#E88FAA" stroke="#E88FAA" stroke-width="2" stroke-linejoin="round"/>
  <path d="M78 42 Q82 18 68 30" fill="#E88FAA" stroke="#E88FAA" stroke-width="2" stroke-linejoin="round"/>
  <!-- Inner ears -->
  <path d="M25 40 Q22 24 33 33" fill="#D4708F" stroke="none"/>
  <path d="M75 40 Q78 24 67 33" fill="#D4708F" stroke="none"/>

  <!-- Head - large round face -->
  <circle cx="50" cy="52" r="28" fill="#E88FAA"/>

  <!-- Blush marks - kawaii style -->
  <ellipse cx="30" cy="58" rx="6" ry="3.5" fill="#D4708F" opacity="0.4"/>
  <ellipse cx="70" cy="58" rx="6" ry="3.5" fill="#D4708F" opacity="0.4"/>

  <!-- Eyes - large, round, anime-style -->
  <ellipse cx="40" cy="49" rx="5.5" ry="6.5" fill="#1a1a2e"/>
  <ellipse cx="60" cy="49" rx="5.5" ry="6.5" fill="#1a1a2e"/>

  <!-- Eye highlights - the key to anime feel -->
  <ellipse cx="42" cy="47" rx="2.5" ry="3" fill="white" opacity="0.95"/>
  <ellipse cx="62" cy="47" rx="2.5" ry="3" fill="white" opacity="0.95"/>
  <!-- Small secondary highlight -->
  <circle cx="38" cy="52" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="58" cy="52" r="1.2" fill="white" opacity="0.6"/>

  <!-- Nose - tiny, cute -->
  <ellipse cx="50" cy="57" rx="2" ry="1.5" fill="#D4708F"/>

  <!-- Mouth - small 'w' shape, cat-like -->
  <path d="M46 60 Q48 62.5 50 60 Q52 62.5 54 60" stroke="#D4708F" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Whisker dots -->
  <circle cx="35" cy="57" r="0.8" fill="#D4708F" opacity="0.5"/>
  <circle cx="33" cy="59" r="0.8" fill="#D4708F" opacity="0.5"/>
  <circle cx="65" cy="57" r="0.8" fill="#D4708F" opacity="0.5"/>
  <circle cx="67" cy="59" r="0.8" fill="#D4708F" opacity="0.5"/>
</svg>
