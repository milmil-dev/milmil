<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>

<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    /*
      Material 3 dark scheme, tonal ramp derived from the brand accent
      (#a78bfa, web/src/styles/theme.css) — M3 builds elevation out of surface
      tone, not shadow, so a flat #0c0c0c everywhere is what made the first
      pass read as "generic dark app" rather than Android.
    */
    :root {
      --primary: #cbb8fd;
      --on-primary: #2c1a63;
      --primary-container: #43307c;
      --on-primary-container: #e8ddff;
      --secondary-container: #453d58;
      --on-secondary-container: #e5dff4;

      --surface: #070707;
      --surface-c-low: #101010;
      --surface-c: #151515;
      --surface-c-high: #1d1d1d;
      --surface-c-highest: #262626;

      --on-surface: rgba(255, 255, 255, 0.93);
      --on-surface-var: rgba(255, 255, 255, 0.62);
      --on-surface-dim: rgba(255, 255, 255, 0.38);
      --outline-var: rgba(255, 255, 255, 0.12);

      /* M3 shape scale — the giveaway. xs 4 · sm 8 · md 12 · lg 16 · xl 28 */
      --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px;
    }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--on-surface);
      /* Android's system font. The macOS client uses .system in 531 places and a
         custom face in one — native clients follow the platform, Figtree is web. */
      font-family: 'Roboto', 'Noto Sans TC', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: #ded0ff; }
    /* Real status bar and gesture bar render on top on device. */
    .safe-top { height: 48px; }
    .shelf { display: flex; gap: 12px; overflow: hidden; }
    /* M3 type scale */
    .headline-s { font-size: 24px; font-weight: 700; line-height: 32px; letter-spacing: 0; }
    .title-l { font-size: 22px; font-weight: 700; line-height: 28px; }
    .title-m { font-size: 16px; font-weight: 600; line-height: 24px; letter-spacing: 0.15px; }
    .title-s { font-size: 14px; font-weight: 600; line-height: 20px; letter-spacing: 0.1px; }
    .body-m { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: 0.25px; }
    .body-s { font-size: 12px; font-weight: 400; line-height: 16px; letter-spacing: 0.4px; }
    .label-l { font-size: 14px; font-weight: 600; line-height: 20px; letter-spacing: 0.1px; }
    .label-m { font-size: 12px; font-weight: 600; line-height: 16px; letter-spacing: 0.5px; }
    /* Android's minimum touch target is 48dp, not 44. */
    .tap { min-width: 48px; min-height: 48px; display: flex; align-items: center; justify-content: center; }
    .card { border-radius: var(--r-md); background: var(--surface-c-low); }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--surface);">

  <div style="position: relative; height: 316px;">
    <img src="hero.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">

      <div class="tap"><svg width="24" height="24" viewBox="0 0 24 24" fill="var(--on-surface)"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></div>
    </div>

        </div>
      </div>

  </div>

  <!-- M3 tonal + outlined buttons, 40dp, fully rounded -->
  <div style="display: flex; gap: 8px; padding: 4px 16px 0 16px;">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--on-secondary-container)"><path d="M6 3h12v18l-6-4.5L6 21Z"/></svg>
      <span class="label-l" style="color: var(--on-secondary-container);">在看</span></div>
    <div style="height: 40px; padding: 0 20px 0 16px; border-radius: 20px; border: 1px solid var(--outline-var); display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-surface)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="m8 11 4 4 4-4"/><path d="M5 19h14"/></svg>
      <span class="label-l" style="color: var(--on-surface);">離線</span></div>
    <div style="height: 40px; padding: 0 20px 0 16px; border-radius: 20px; border: 1px solid var(--outline-var); display: flex; align-items: center; gap: 8px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--on-surface)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m8 7 4-4 4 4"/><path d="M5 14v6h14v-6"/></svg>
      <span class="label-l" style="color: var(--on-surface);">分享</span></div>
  </div>

  <div style="display: flex; margin-top: 16px; border-bottom: 1px solid var(--outline-var);">
    <div style="flex: 1; height: 48px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -3px 0 var(--primary);"><span class="title-s" style="color: var(--primary);">分集</span></div>
    <div style="flex: 1; height: 48px; display: flex; align-items: center; justify-content: center;"><span class="title-s" style="color: var(--on-surface-var);">角色</span></div>
    <div style="flex: 1; height: 48px; display: flex; align-items: center; justify-content: center;"><span class="title-s" style="color: var(--on-surface-var);">簡介</span></div>
  </div>
<div style="min-height: 88px; display: flex; gap: 16px; align-items: center; padding: 8px 16px;"><div style="position: relative; flex: none;"><img src="still.jpg" alt="" style="width: 120px; height: 68px; border-radius: var(--r-sm); object-fit: cover; display: block;"><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(0,0,0,0.55); border-radius: 0 0 var(--r-sm) var(--r-sm);"><div style="width: 26%; height: 4px; background: var(--primary); border-radius: 0 0 0 var(--r-sm);"></div></div></div><div style="flex: 1; min-width: 0;"><div class="label-m" style="color: var(--primary);">EP 41</div><div class="title-m" style="margin-top: 2px;">雷神</div><div class="body-s" style="color: var(--on-surface-var); margin-top: 2px;">已看 6:06 / 23:50 · 794 MB</div></div><div class="tap"><svg width="24" height="24" viewBox="0 0 24 24" fill="var(--on-surface-var)"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></div></div>
<div style="min-height: 88px; display: flex; gap: 16px; align-items: center; padding: 8px 16px;"><div style="position: relative; flex: none;"><img src="still.jpg" alt="" style="width: 120px; height: 68px; border-radius: var(--r-sm); object-fit: cover; display: block;"></div><div style="flex: 1; min-width: 0;"><div class="label-m" style="color: var(--primary);">EP 42</div><div class="title-m" style="margin-top: 2px;">黑暗之子</div><div class="body-s" style="color: var(--on-surface-var); margin-top: 2px;">790 MB</div></div><div class="tap"><svg width="24" height="24" viewBox="0 0 24 24" fill="var(--on-surface-var)"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></div></div>
<div style="min-height: 88px; display: flex; gap: 16px; align-items: center; padding: 8px 16px;"><div style="position: relative; flex: none;"><img src="still.jpg" alt="" style="width: 120px; height: 68px; border-radius: var(--r-sm); object-fit: cover; display: block;"></div><div style="flex: 1; min-width: 0;"><div class="label-m" style="color: var(--primary);">EP 43</div><div class="title-m" style="margin-top: 2px;">以血祭骨</div><div class="body-s" style="color: var(--on-surface-var); margin-top: 2px;">尚未下載</div></div><div class="tap"><svg width="24" height="24" viewBox="0 0 24 24" fill="var(--on-surface-var)"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></div></div>
  <div style="position: absolute; right: 16px; bottom: 24px; height: 56px; border-radius: var(--r-lg); background: var(--primary-container); display: flex; align-items: center; gap: 8px; padding: 0 20px; box-shadow: 0 3px 8px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.4);">
