<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <style>
    /*
      Material 3 dark scheme, tonal ramp derived from the brand accent
      (#a78bfa, web/src/styles/theme.css) — M3 builds elevation out of surface
      tone, not shadow, so a flat #0c0c0c everywhere is what made the first
      pass read as "generic dark app" rather than Android.
    */
    :root {
      --primary: #cbb8fd;
      --on-primary: #2c1a63;
      --primary-container: #43307c;
      --on-primary-container: #e8ddff;
      --secondary-container: #453d58;
      --on-secondary-container: #e5dff4;

      --surface: #070707;
      --surface-c-low: #101010;
      --surface-c: #151515;
      --surface-c-high: #1d1d1d;
      --surface-c-highest: #262626;

      --on-surface: rgba(255, 255, 255, 0.93);
      --on-surface-var: rgba(255, 255, 255, 0.62);
      --on-surface-dim: rgba(255, 255, 255, 0.38);
      --outline-var: rgba(255, 255, 255, 0.12);

      /* M3 shape scale — the giveaway. xs 4 · sm 8 · md 12 · lg 16 · xl 28 */
      --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px;
    }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--on-surface);
      /* Android's system font. The macOS client uses .system in 531 places and a
         custom face in one — native clients follow the platform, Figtree is web. */
      font-family: 'Roboto', 'Noto Sans TC', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); text-decoration: none; }
    a:hover { color: #ded0ff; }
    /* Real status bar and gesture bar render on top on device. */
    .safe-top { height: 48px; }
    .shelf { display: flex; gap: 12px; overflow: hidden; }
    /* M3 type scale */
    .headline-s { font-size: 24px; font-weight: 700; line-height: 32px; letter-spacing: 0; }
    .title-l { font-size: 22px; font-weight: 700; line-height: 28px; }
    .title-m { font-size: 16px; font-weight: 600; line-height: 24px; letter-spacing: 0.15px; }
    .title-s { font-size: 14px; font-weight: 600; line-height: 20px; letter-spacing: 0.1px; }
    .body-m { font-size: 14px; font-weight: 400; line-height: 20px; letter-spacing: 0.25px; }
    .body-s { font-size: 12px; font-weight: 400; line-height: 16px; letter-spacing: 0.4px; }
    .label-l { font-size: 14px; font-weight: 600; line-height: 20px; letter-spacing: 0.1px; }
    .label-m { font-size: 12px; font-weight: 600; line-height: 16px; letter-spacing: 0.5px; }
    /* Android's minimum touch target is 48dp, not 44. */
    .tap { min-width: 48px; min-height: 48px; display: flex; align-items: center; justify-content: center; }
    .card { border-radius: var(--r-md); background: var(--surface-c-low); }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--surface);">

  <div style="position: relative; height: 400px;">
    <img src="hero.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,7,7,0.5) 0%, rgba(7,7,7,0.05) 34%, rgba(7,7,7,0.9) 84%, var(--surface) 100%);"></div>

    <!-- M3 small top app bar: 64dp, title 22sp, trailing icon buttons -->
    <div class="safe-top"></div>
    <div style="position: relative; height: 64px; display: flex; align-items: center; padding: 0 4px 0 16px;">
      <span class="title-l" style="flex: 1;">milmil</span>
      <div class="tap"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--on-surface)" stroke-width="1.9" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg></div>
      <div class="tap"><div style="width: 32px; height: 32px; border-radius: 16px; background: var(--primary-container); display: flex; align-items: center; justify-content: center;"><span class="label-l" style="color: var(--on-primary-container);">A</span></div></div>
    </div>

    <div style="position: absolute; left: 16px; right: 16px; bottom: 20px;">
      <div class="headline-s" style="text-wrap: pretty;">BLEACH 千年血戰篇<br>禍進譚</div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px;">
        <span class="label-l" style="display: inline-flex; align-items: center; gap: 4px; color: var(--primary);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#cbb8fd"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 4.6-7 9-7 9Z"/></svg>8.2</span>
        <span class="body-s" style="color: var(--on-surface-var);">2026 夏 · 10 集</span>
      </div>
    </div>
  </div>

  <!-- 今日時間表 -->
  <div style="padding: 8px 0 0 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; padding-right: 8px;">
      <span class="title-m">今日時間表</span>
      <div style="min-height: 40px; padding: 0 12px; border-radius: 20px; display: flex; align-items: center;"><span class="label-l" style="color: var(--primary);">星期四</span></div>
    </div>
    <div class="shelf" style="margin-top: 4px;">
      <div style="width: 108px; flex: none;"><div style="position: relative;"><img src="poster0.jpg" alt="" style="width: 108px; height: 154px; border-radius: var(--r-md); object-fit: cover; display: block;"><span class="label-m" style="position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.62); border-radius: var(--r-sm); padding: 3px 8px; color: #fff;">EP 9</span></div><div class="title-s" style="margin-top: 8px;">MEBIUS DUST</div></div>
      <div style="width: 108px; flex: none;"><div style="position: relative;"><img src="poster1.jpg" alt="" style="width: 108px; height: 154px; border-radius: var(--r-md); object-fit: cover; display: block;"><span class="label-m" style="position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.62); border-radius: var(--r-sm); padding: 3px 8px; color: #fff;">EP 27</span></div><div class="title-s" style="margin-top: 8px;">花之天使</div></div>
      <div style="width: 108px; flex: none;"><div style="position: relative;"><img src="poster2.jpg" alt="" style="width: 108px; height: 154px; border-radius: var(--r-md); object-fit: cover; display: block;"><span class="label-m" style="position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.62); border-radius: var(--r-sm); padding: 3px 8px; color: #fff;">EP 13</span></div><div class="title-s" style="margin-top: 8px;">太古神尊</div></div>
    </div>
  </div>

  <!-- 熱門 -->
  <div style="padding: 20px 0 0 16px;">
    <span class="title-m">熱門</span>
    <div class="shelf" style="margin-top: 10px;">
      <div style="width: 108px; flex: none;"><img src="poster4.jpg" alt="" style="width: 108px; height: 154px; border-radius: var(--r-md); object-fit: cover; display: block;"></div>
      <div style="width: 108px; flex: none;"><img src="poster5.jpg" alt="" style="width: 108px; height: 154px; border-radius: var(--r-md); object-fit: cover; display: block;"></div>
      <div style="width: 108px; flex: none;"><img src="poster3.jpg" alt="" style="width: 108px; height: 154px; border-radius: var(--r-md); object-fit: cover; display: block;"></div>
    </div>
  </div>

  <!-- M3 extended FAB: 56dp, 16dp radius, primaryContainer, floats above the
       nav bar. This is the component the first pass was missing entirely. -->
  <div style="position: absolute; right: 16px; bottom: 96px; height: 56px; border-radius: var(--r-lg); background: var(--primary-container); display: flex; align-items: center; gap: 8px; padding: 0 20px; box-shadow: 0 3px 8px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.4);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--on-primary-container)"><path d="M7 4.5v15l12-7.5Z"/></svg>
    <span class="label-l" style="color: var(--on-primary-container);">繼續看 EP 41</span>
  </div>
<!-- M3 navigation bar: 80dp, active destination carries a 64x32 pill indicator
     in secondaryContainer, its icon switches to the filled variant. -->
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: var(--surface-c); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 12px;">
  <div style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <div style="width: 64px; height: 32px; border-radius: 16px; background: var(--secondary-container); display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="var(--on-secondary-container)" stroke="var(--on-secondary-container)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1Z"/></svg>
    </div>
    <span class="label-m" style="color: var(--on-surface);">首頁</span>
  </div>
  <div style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <div style="width: 64px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--on-surface-var)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    </div>
    <span class="label-m" style="color: var(--on-surface-var);">時間表</span>
  </div>
  <div style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <div style="width: 64px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--on-surface-var)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c2.7 3.4 4.3 6 4.3 8.5a4.3 4.3 0 0 1-8.6 0c0-1 .3-2 1-3 .2 1.4.9 2.1 1.7 2.3C10.2 8 10.7 5.3 12 2.5Z"/><path d="M6.5 13.5a5.5 5.5 0 0 0 11 0"/></svg>
    </div>
    <span class="label-m" style="color: var(--on-surface-var);">探索</span>
  </div>
  <div style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <div style="width: 64px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--on-surface-var)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    </div>
    <span class="label-m" style="color: var(--on-surface-var);">搜尋</span>
  </div>
  <div style="width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
    <div style="width: 64px; height: 32px; border-radius: 16px; background: transparent; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--on-surface-var)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4.5L6 21Z"/></svg>
    </div>
    <span class="label-m" style="color: var(--on-surface-var);">收藏</span>
  </div>
</div>
</div>
</x-dc>
</body>
</html>
