<!doctype html>

<x-dc>
<helmet>
  <style>
    /*
      iOS 26 Liquid Glass. Not invented here — macos/Milmil/Design/GlassStyles.swift
      already adopts it: glassEffect(.regular, in:) for floating chrome,
      glassSurface(in: Capsule()) for the player HUD, and .glassProminent filled
      with INK, never the accent ("Vesica Violet is for state and emphasis, not
      for button backgrounds"). The iOS client inherits those rules verbatim.
      System font: -apple-system renders as real SF Pro on a Mac.
    */
    :root {
      --tint: #a78bfa;
      --ink: rgba(255, 255, 255, 0.92);
      --bg: #070707;
      --label: #ffffff;
      --label2: rgba(235, 235, 245, 0.6);
      --label3: rgba(235, 235, 245, 0.3);
      --sep: rgba(84, 84, 88, 0.5);
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
        'PingFang TC', 'Helvetica Neue', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--tint); text-decoration: none; }
    a:hover { color: #c4b1fd; }
    .safe-top { height: 59px; }
    .shelf { display: flex; gap: 12px; overflow: hidden; }

    /* Liquid Glass: translucent layer, specular top edge, hairline rim, and a
       cast shadow — the material floats above content rather than boxing it. */
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.16), rgba(255,255,255,0.045));
      backdrop-filter: blur(26px) saturate(180%);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.5),
        inset 0 -0.5px 0 rgba(255,255,255,0.1),
        inset 0 0 0 0.5px rgba(255,255,255,0.13),
        0 10px 30px rgba(0,0,0,0.45);
    }
    /* Larger surfaces read thinner or they turn milky. */
    .glass-thin {
      background: linear-gradient(180deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
      backdrop-filter: blur(30px) saturate(170%);
      box-shadow:
        inset 0 0.5px 0 rgba(255,255,255,0.36),
        inset 0 0 0 0.5px rgba(255,255,255,0.1),
        0 12px 34px rgba(0,0,0,0.5);
    }
    /* .glassProminent — ink fill, inverted label. Never the accent. */
    .glass-prominent {
      background: var(--ink);
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.9), 0 8px 24px rgba(0,0,0,0.4);
      color: #070707;
    }
    /* iOS type ramp */
    .large-title { font-size: 34px; font-weight: 700; letter-spacing: 0.37px; line-height: 41px; }
    .title3 { font-size: 20px; font-weight: 600; letter-spacing: 0.38px; }
    .headline { font-size: 17px; font-weight: 600; letter-spacing: -0.41px; }
    .body { font-size: 17px; font-weight: 400; letter-spacing: -0.41px; }
    .subhead { font-size: 15px; font-weight: 400; letter-spacing: -0.24px; }
    .footnote { font-size: 13px; font-weight: 400; letter-spacing: -0.08px; }
    .caption { font-size: 12px; font-weight: 400; }
    .tap { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
    /* Circular glass chip — how iOS 26 floats a bar button over content. */
    .chip { width: 38px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--bg);">

  <div style="padding: 0 16px;"><span class="large-title">搜尋</span></div>

<div style="display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 0.5px solid rgba(255,255,255,0.08);"><img src="poster1.jpg" alt="" style="width: 52px; height: 74px; border-radius: 10px; object-fit: cover;"><div style="flex: 1; min-width: 0;"><div class="subhead" style="font-weight: 500;">BLEACH 千年血戰篇-相剋譚-</div><div class="footnote" style="color: var(--label2); margin-top: 2px;">2025 · 13 集</div></div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--label3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
<div style="display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 0.5px solid rgba(255,255,255,0.08);"><img src="poster2.jpg" alt="" style="width: 52px; height: 74px; border-radius: 10px; object-fit: cover;"><div style="flex: 1; min-width: 0;"><div class="subhead" style="font-weight: 500;">BLEACH 千年血戰篇-訣別譚-</div><div class="footnote" style="color: var(--label2); margin-top: 2px;">2024 · 13 集</div></div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--label3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
<div style="display: flex; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 0.5px solid rgba(255,255,255,0.08);"><img src="poster3.jpg" alt="" style="width: 52px; height: 74px; border-radius: 10px; object-fit: cover;"><div style="flex: 1; min-width: 0;"><div class="subhead" style="font-weight: 500;">BLEACH 死神</div><div class="footnote" style="color: var(--label2); margin-top: 2px;">2004 · 366 集</div></div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--label3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
<div style="display: flex; gap: 12px; align-items: center; padding: 8px 12px; "><img src="poster4.jpg" alt="" style="width: 52px; height: 74px; border-radius: 10px; object-fit: cover;"><div style="flex: 1; min-width: 0;"><div class="subhead" style="font-weight: 500;">BLEACH 劇場版：地獄篇</div><div class="footnote" style="color: var(--label2); margin-top: 2px;">2010 · 劇場版</div></div><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--label3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg></div>
