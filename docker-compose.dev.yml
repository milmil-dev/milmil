# Development override — replaces published images with local builds.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Postgres + Redis come from docker-compose.yml unchanged.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
