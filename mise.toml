[tools]
go = "1.27.0"
bun = "1.4.0"
# Pinned so `sqlc generate` reproduces the committed code byte for byte.
# Newer sqlc changes generated signatures (1.31 returns bool where 1.30
# returned int64), which would show up as unrelated churn.
sqlc = "1.30.0"
# macOS client (macos/). Xcode itself is not managed here — see macos/AGENTS.md.
xcodegen = "2.44.1"
swiftlint = "0.63.2"
watchexec = "2.3.2"   # `make macos-watch`
java = "temurin-21.0.12+101.0.LTS"  # android/ — AGP needs a JDK 21 LTS
gradle = "9.7.1"      # only to generate the wrapper; builds go through ./gradlew

[tasks."macos:gen"]
description = "Generate macos/Milmil.xcodeproj from project.yml"
dir = "macos"
run = "xcodegen generate --quiet"
