name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned tool versions (mirror mise.toml).
env:
  GO_VERSION: "1.26.1"
  BUN_VERSION: "1.4.0"
  GOLANGCI_LINT_VERSION: "v2.13.0"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    # golangci-lint has to type-check the whole dependency graph, and this
    # module pulls in rclone, the AWS SDK and anacrolix/torrent. A dependency
    # bump changes go.sum, which misses setup-go's build cache, and the lint
    # step alone then runs past 20 minutes from cold — #106 was cancelled at
    # exactly 25. Warm runs finish the whole job in about 11.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: gofmt check
        working-directory: api
        run: |
          set -euo pipefail
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy check
        working-directory: api
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: api
          args: --timeout=30m

      # Fast feedback before the much slower instrumented run below.
      - name: go test
        working-directory: api
        run: go test ./...

      - name: go test (race + cover)
        working-directory: api
        run: go test -race -cover ./...

      - name: go build
        working-directory: api
        run: go build -o /dev/null ./cmd/server

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # typecheck + lint + format:check + test:run
      - name: check:all
        working-directory: web
        run: bun run check:all

      - name: Unused files, exports and dependencies
        working-directory: web
        run: bun run knip

      - name: Production build
        working-directory: web
        run: bun run i18n:compile && bun run build

      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium

      # Every spec stubs the API with page.route; the one that needs a live
      # backend is gated behind MILMIL_E2E_LIVE and stays out of CI.
      - name: End-to-end tests
        working-directory: web
        run: bunx playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: docs-site
        run: bun run lint

      - name: Typecheck
        working-directory: docs-site
        run: bun run types:check

      - name: Build docs site
        working-directory: docs-site
        run: bun run build

      - name: Install Playwright browser
        working-directory: docs-site
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: docs-site
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-report
          path: docs-site/test-results
          retention-days: 7
