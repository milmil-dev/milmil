name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned tool versions (mirror mise.toml).
env:
  GO_VERSION: "1.26.1"
  BUN_VERSION: "1.4.0"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: api/go.sum

      - name: gofmt check
        working-directory: api
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::warning::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy check
        working-directory: api
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: go vet
        working-directory: api
        run: go vet ./...

      # Informational: the race detector itself is clean (a full -race run
      # reports 0 data races), but it slows execution several-fold, which
      # trips the wall-clock assertion in anidb's TestTitlesPerfWithLargeIndex
      # ("must be <1s"). Flip continue-on-error to false once that test
      # relaxes or skips its threshold under -race.
      - name: go test (race + cover, informational)
        continue-on-error: true
        working-directory: api
        run: go test -race -cover ./...

      - name: go test
        working-directory: api
        run: go test ./...

      - name: go build
        working-directory: api
        run: go build -o /dev/null ./cmd/server

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # Full quality gate: typecheck + lint + format:check + test:run.
      # Covers linting and unit tests, so they are not run separately.
      - name: check:all
        working-directory: web
        run: bun run check:all

      - name: Production build
        working-directory: web
        run: bun run i18n:compile && bun run build

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: docs-site
        run: bun run lint

      - name: Typecheck
        working-directory: docs-site
        run: bun run types:check

      - name: Build docs site
        working-directory: docs-site
        run: bun run build

      - name: Install Playwright browser
        working-directory: docs-site
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: docs-site
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-report
          path: docs-site/test-results
          retention-days: 7
