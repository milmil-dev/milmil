name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned tool versions (mirror mise.toml).
env:
  GO_VERSION: "1.27.0"
  BUN_VERSION: "1.4.0"
  GOLANGCI_LINT_VERSION: "v2.13.1"
  JAVA_VERSION: "21"

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          # setup-go's own cache keys on go.sum exactly, so every dependency
          # bump starts from nothing. The step below adds a fallback.
          cache: false

      # golangci-lint type-checks the whole graph — rclone, the AWS SDK and
      # anacrolix/torrent — so a cold build cache costs 40 minutes. restore-keys
      # lets a dependency bump reuse the previous run's cache and recompile only
      # what actually changed.
      - name: Restore Go module and build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('api/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: gofmt check
        working-directory: api
        run: |
          set -euo pipefail
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy check
        working-directory: api
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Installed directly rather than via golangci-lint-action: the action
      # manages its own cache, which does not include the Go build cache that
      # actually dominates the run here, so it kept overshooting the job
      # timeout on dependency bumps. The prebuilt binary plus the shared cache
      # above is one caching story instead of two fighting each other.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"

      - name: golangci-lint
        working-directory: api
        run: golangci-lint run --timeout=20m

      # Fast feedback before the much slower instrumented run below.
      - name: go test
        working-directory: api
        run: go test ./...

      - name: go test (race + cover)
        working-directory: api
        run: go test -race -cover ./...

      - name: go build
        working-directory: api
        run: go build -o /dev/null ./cmd/server

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      # typecheck + lint + format:check + test:run
      - name: check:all
        working-directory: web
        run: bun run check:all

      - name: Unused files, exports and dependencies
        working-directory: web
        run: bun run knip

      - name: Production build
        working-directory: web
        run: bun run i18n:compile && bun run build

      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium

      # Every spec stubs the API with page.route; the one that needs a live
      # backend is gated behind MILMIL_E2E_LIVE and stays out of CI.
      - name: End-to-end tests
        working-directory: web
        run: bunx playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: web-playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: docs-site
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: docs-site
        run: bun run lint

      - name: Typecheck
        working-directory: docs-site
        run: bun run types:check

      - name: Build docs site
        working-directory: docs-site
        run: bun run build

      - name: Install Playwright browser
        working-directory: docs-site
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: docs-site
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: docs-playwright-report
          path: docs-site/test-results
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 40
    env:
      XCODEGEN_VERSION: "2.44.1"
      SWIFTLINT_VERSION: "0.63.2"
    steps:
      - uses: actions/checkout@v7

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # Homebrew bottles are the quickest way to the pinned versions on the
      # hosted runner; mise.toml carries the same pins for local installs.
      - name: Install xcodegen and swiftlint
        run: brew install xcodegen swiftlint

      - name: SwiftLint
        working-directory: macos
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: String catalog is in sync and fully translated
        working-directory: macos
        run: python3 scripts/i18n_sync.py --check && git diff --exit-code Milmil/Resources/Localizable.xcstrings

      - name: Restore SwiftPM cache
        uses: actions/cache@v6
        with:
          path: |
            macos/Packages/MilmilKit/.build
            macos/Packages/MilmilPlayer/.build
            ~/Library/Developer/Xcode/DerivedData
          key: macos-${{ runner.os }}-${{ hashFiles('macos/Packages/**/Package.swift', 'macos/project.yml') }}
          restore-keys: |
            macos-${{ runner.os }}-

      - name: Package tests
        run: |
          swift test --package-path macos/Packages/MilmilKit
          swift test --package-path macos/Packages/MilmilPlayer

      - name: Generate project
        working-directory: macos
        run: xcodegen generate --quiet

      - name: Build app
        working-directory: macos
        run: |
          xcodebuild -project Milmil.xcodeproj -scheme Milmil \
            -destination 'platform=macOS,arch=arm64' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build

      # The iOS client is not a separate workspace so much as a second face on
      # the same MilmilKit — building it here is what stops a macOS-shaped
      # change to the package from silently breaking it.
      - name: Generate iOS project
        working-directory: ios
        run: xcodegen generate --quiet

      - name: Build iOS app
        working-directory: ios
        run: |
          xcodebuild -project Milmil.xcodeproj -scheme Milmil \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -quiet build

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      # Android Lint fails the build on errors, which is where AGP puts the
      # things that actually break at runtime (manifest, resources, API level).
      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      - name: Unit tests
        working-directory: android
        run: ./gradlew :core:api:test :app:testDebugUnitTest

      - name: Build app
        working-directory: android
        run: ./gradlew assembleDebug
