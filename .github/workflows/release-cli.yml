name: Release CLI

# Releases the `milmil` CLI binary on `cli-v*` tags. Server releases use
# the `v*` tag namespace handled by publish.yml + release-please.
on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write   # goreleaser needs to create a Release

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  goreleaser:
    name: Build and publish CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          # goreleaser needs the full history to compute the changelog
          # since the last cli-v* tag.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
