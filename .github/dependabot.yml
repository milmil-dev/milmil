version: 2
updates:
  # Go modules
  - package-ecosystem: "gomod"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "go"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      go-deps-major:
        patterns: ["*"]
        update-types: ["major"]

  # Frontend (web)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      web-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      web-deps-major:
        patterns: ["*"]
        update-types: ["major"]

  # Documentation site
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencies", "javascript", "docs"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docs-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      docs-deps-major:
        patterns: ["*"]
        update-types: ["major"]

  # Docker base images — group api + web into one PR per week
  - package-ecosystem: "docker"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-api:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      docker-web:
        patterns: ["*"]

  # GitHub Actions — group everything into one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
