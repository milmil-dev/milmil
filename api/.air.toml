root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go", "tpl", "tmpl", "html", "sql"]
  exclude_dir = ["tmp", "vendor", "testdata", "internal/store"]
  delay = 1000
  stop_on_error = true

[log]
  time = false

[color]
  main   = "magenta"
  build  = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
