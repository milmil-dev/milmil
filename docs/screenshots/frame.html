<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    justify-content: center;
    padding: 20px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang HK', sans-serif;
  }
  .window {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.08);
    max-width: 1400px;
    width: 100%;
  }
  .titlebar {
    background: linear-gradient(180deg, #3a3a3c 0%, #2c2c2e 100%);
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 8px;
    border-bottom: 1px solid #1a1a1c;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .dot.close { background: #ff5f57; }
  .dot.minimize { background: #febc2e; }
  .dot.maximize { background: #28c840; }
  .titlebar-text {
    flex: 1;
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-right: 52px;
  }
  .content img {
    display: block;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="dot close"></div>
      <div class="dot minimize"></div>
      <div class="dot maximize"></div>
      <span class="titlebar-text" id="title">milmil</span>
    </div>
    <div class="content">
      <img id="screenshot" />
    </div>
  </div>
  <script>
    // Whitelist: relative filename, alphanumerics + basic separators, image extension.
    // Prevents the img.src sink from being fed a javascript: or cross-origin URL.
    const SAFE_SRC = /^[\w.-]+\.(png|jpe?g|webp)$/;
    const params = new URLSearchParams(window.location.search);
    const src = params.get('src');
    const title = params.get('title') || 'milmil';
    if (src && SAFE_SRC.test(src)) {
      document.getElementById('screenshot').src = src;
    }
    document.getElementById('title').textContent = title;
  </script>
</body>
</html>
