services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${MEDIA_DIR:-/mnt/media}:/media:ro
    env_file:
      - ./api/.env
    environment:
      - DATA_DIR=/data
      - DATABASE_URL=sqlite:///data/milmil.db
      - API_PORT=8080

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      - VITE_API_URL=http://localhost:${API_PORT:-8080}
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    profiles:
      - with-redis

volumes:
  redis-data:
