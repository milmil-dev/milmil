# Goreleaser config for the `milmil` CLI binary.
#
# Application/server releases are managed separately via release-please +
# publish.yml on `v*` tags. CLI releases use the `cli-v*` tag prefix so
# the two cadences stay decoupled.
#
# Local validation:
#   goreleaser check
#   goreleaser build --snapshot --clean
#
# Producing a release:
#   git tag cli-v0.1.0 && git push origin cli-v0.1.0
# (the release.yml workflow will run goreleaser release --clean)

version: 2
project_name: milmil

# The `cli-v` tag prefix lives outside goreleaser's auto-computed
# .Version (the monorepo block that does this is a Pro feature). The
# release workflow strips `cli-v` and exports the result as
# GORELEASER_CURRENT_TAG, so inside this file `.Version` already holds
# the SemVer (e.g. `0.1.0`) and `.Tag` holds `v0.1.0`.
# Server/Docker releases stay on the `v*` tag namespace handled by
# publish.yml.

before:
  hooks:
    - go -C api mod tidy

builds:
  - id: milmil
    main: ./cmd/cli
    dir: api
    binary: milmil
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: milmil-archive
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "milmil_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README*.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-snapshot-{{ .ShortCommit }}"

changelog:
  # Release notes are produced by `gh release create --generate-notes`
  # in release-cli.yml, scoped to commits since the previous cli-v* tag.
  # Goreleaser's changelog would reach for the GitHub compare API
  # against the v* server tag namespace and 404, so disable it here.
  disable: true

release:
  # The GitHub release is created by release-cli.yml via `gh release
  # create`, not by goreleaser. The workflow strips the `cli-v` prefix
  # for goreleaser (so .Version is valid SemVer) but uses the original
  # `cli-v*` tag for the actual release on GitHub. Disabling here keeps
  # the cli-v* tag namespace clean and avoids polluting the v* server tags.
  disable: true
