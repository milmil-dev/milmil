services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-milmil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-milmil}
      POSTGRES_DB: ${POSTGRES_DB:-milmil}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-milmil}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  milmil-api:
    build:
      context: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-milmil}:${POSTGRES_PASSWORD:-milmil}@postgres:5432/${POSTGRES_DB:-milmil}?sslmode=disable
      REDIS_URL: redis://redis:6379
      ARIA2_RPC_URL: http://aria2:6800/jsonrpc
    volumes:
      - ./data:/app/data
      - ./media:/media
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      aria2:
        condition: service_started

  milmil-web:
    build:
      context: ./web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - milmil-api

volumes:
  pgdata:
